  worker-news:
    profiles: ["scrapers"]
    build:
      # Root context so libs/bangla-text can be copied in — same arrangement as
      # falcon-core with libs/shared-types and libs/database. .dockerignore keeps
      # the context small. See the header of the Dockerfile for why the shared
      # normalizer must not be vendored.
      context: .
      dockerfile: apps/scrapers/worker-news/Dockerfile
    container_name: worker-news
    restart: unless-stopped
    # VNC desktop ONLY — no google-chrome in this shell. Chrome is launched by
    # routes/vnc_desktop.py `_launch_chrome()` as an argv list; see the comment
    # on the Dockerfile CMD for the two failures that rule out. Must stay
    # byte-identical to that CMD and to the `command:` in docker-compose.yml /
    # docker-compose.ghcr.yml (enforced by
    # apps/scrapers/worker-news/tests/test_dockerfile_cmd.py).
    command:
    - sh
    - -lc
    # $$ escapes Compose's own interpolation so a literal $ reaches the
    # container's shell, which expands these from the container environment
    # (service `environment:` + the image's ENV defaults). A bare ${WORKERS}
    # here is substituted by Compose from .env/host env instead — where it is
    # undefined — and gunicorn dies with "argument -w/--workers: expected one
    # argument". The Dockerfile CMD needs no escaping; only compose does.
    - 'rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; mkdir -p $${NEWS_VNC_PROFILE_DIR:-/app/news_vnc_profile}; Xvfb :99 -screen 0 1280x800x16 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; if command -v xset >/dev/null 2>&1; then xset s off -dpms s noblank; fi; openbox >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -noxdamage -xkb -repeat -defer 10 -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & exec gunicorn -c gunicorn_conf.py --bind 0.0.0.0:$${PORT} --workers $${WORKERS} --threads $${THREADS} --timeout $${GUNICORN_TIMEOUT} --graceful-timeout $${GUNICORN_GRACEFUL_TIMEOUT} --max-requests $${GUNICORN_MAX_REQUESTS} --max-requests-jitter $${GUNICORN_MAX_REQUESTS_JITTER} app:app'
    ports:
    - 12080:3012
    environment:
      PORT: 3012
      DISPLAY: :99
      NEWS_VNC_PROFILE_DIR: /app/news_vnc_profile
      NEWS_CDP_HOST: 127.0.0.1
      NEWS_CDP_PORT: 9333
      NEWS_VIEWER_URL: ${NEWS_VIEWER_URL:-/viewer/worker-news/vnc/vnc.html?autoconnect=1&resize=scale&path=viewer/worker-news/vnc/websockify}
      NEWS_RAW_NOVNC_URL: ${NEWS_RAW_NOVNC_URL:-/viewer/worker-news/vnc/vnc.html?autoconnect=1&resize=scale&path=viewer/worker-news/vnc/websockify}
      REDIS_HOST: falcon-redis
      REDIS_PORT: 6379
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/falcon_ai?schema=public
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-85234569495721}
      WORKERS: ${NEWS_WORKERS:-2}
      THREADS: ${NEWS_THREADS:-2}
      SOURCE_WORKERS: ${SOURCE_WORKERS:-2}
      # Never 0: an unbounded timeout lets a hung scrape pin its thread and its
      # Chromium forever, which is how this container reached 7k PIDs / 12GiB.
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      GUNICORN_GRACEFUL_TIMEOUT: 30
      GUNICORN_MAX_REQUESTS: 200
      GUNICORN_MAX_REQUESTS_JITTER: 50
      # Browser lifetime caps — see news_scraper/utils/browser_manager.py
      NEWS_BROWSER_MAX_AGE_SECONDS: ${NEWS_BROWSER_MAX_AGE_SECONDS:-180}
      NEWS_BROWSER_MAX_USES: ${NEWS_BROWSER_MAX_USES:-15}
      NEWS_BROWSER_REAPER_INTERVAL_SECONDS: ${NEWS_BROWSER_REAPER_INTERVAL_SECONDS:-15}
      NEWS_BROWSER_TOTAL_SLOTS: ${NEWS_BROWSER_TOTAL_SLOTS:-6}
      NEWS_BROWSER_STUDIO_RESERVED: ${NEWS_BROWSER_STUDIO_RESERVED:-2}
      NEWS_BROWSER_AUTO_SLOTS: ${NEWS_BROWSER_AUTO_SLOTS:-3}
      NEWS_BROWSER_AUTO_WHEN_STUDIO: ${NEWS_BROWSER_AUTO_WHEN_STUDIO:-0}
      NEWS_BROWSER_INTERACTIVE_SLOTS: ${NEWS_BROWSER_INTERACTIVE_SLOTS:-2}
      NEWS_BROWSER_INTERACTIVE_WHEN_STUDIO: ${NEWS_BROWSER_INTERACTIVE_WHEN_STUDIO:-0}
      NEWS_BROWSER_LANE_ACQUIRE_TIMEOUT: ${NEWS_BROWSER_LANE_ACQUIRE_TIMEOUT:-45}
      NEWS_BROWSER_MAX_LIVE: ${NEWS_BROWSER_MAX_LIVE:-6}
      NEWS_BROWSER_PROCS_PER_SLOT: ${NEWS_BROWSER_PROCS_PER_SLOT:-12}
      NEWS_BROWSER_RELEASE_ON_CONTEXT_CLOSE: ${NEWS_BROWSER_RELEASE_ON_CONTEXT_CLOSE:-1}
      NEWS_BROWSER_ORPHAN_KILL: ${NEWS_BROWSER_ORPHAN_KILL:-1}
      NEWS_BROWSER_RSS_PRESSURE_RATIO: ${NEWS_BROWSER_RSS_PRESSURE_RATIO:-0.82}
      NEWS_BROWSER_LAUNCH_WAIT_SECONDS: ${NEWS_BROWSER_LAUNCH_WAIT_SECONDS:-20}
      NEWS_CLEAR_LANES_ON_START: ${NEWS_CLEAR_LANES_ON_START:-1}

      # Per-source article fetch pool (news_scraper/base_scraper.py). Stacks on top
      # of WORKERS x THREADS, so it is sized by the profile, not left at the code default.
      NEWS_ARTICLE_EXECUTOR_WORKERS: ${NEWS_ARTICLE_EXECUTOR_WORKERS:-16}
      NEWS_ARTICLE_TIMEOUT_SECONDS: ${NEWS_ARTICLE_TIMEOUT_SECONDS:-30}
      NEWS_SOURCE_TIMEOUT_SECONDS: ${NEWS_SOURCE_TIMEOUT_SECONDS:-180}
      NEWS_TOP_NEWS_SOURCE_TIMEOUT_SECONDS: ${NEWS_TOP_NEWS_SOURCE_TIMEOUT_SECONDS:-180}
      NEWS_TODAYS_SOURCE_TIMEOUT_SECONDS: ${NEWS_TODAYS_SOURCE_TIMEOUT_SECONDS:-180}
      NEWS_SCROLL_REFRESH_INTERVAL_SECONDS: 15
      PROXY_ROTATOR_URL: http://proxy-rotator:8888
      PROXY_ENABLED: 'true'
      STUDIO_USE_PROXY: '1'
      FLARESOLVERR_URL: http://flaresolverr:8191
      FLARESOLVERR_ENABLED: 'true'
      # MinIO — News Source Studio configs (studio-configs/news/*.json)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-falcon-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: imas
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:12004}
      MINIO_PUBLIC_USE_SSL: 'false'
    # Chromium launches with --disable-dev-shm-usage, so a large /dev/shm is wasted
    # reservation — and tmpfs pages are charged to this container's memory cgroup.
    shm_size: "${FALCON_SZ_NEWS_SHM:-1gb}"
    # tini as PID 1: orphaned Chromium processes reparent to it and get reaped,
    # instead of accumulating as zombies under `sh -c`.
    init: true
    # A leak should fail loudly here rather than quietly consuming the host.
    # Kept in sync with deploy.resources.limits.pids below: Compose v5 rejects the
    # project when the two differ, and treats an absent one as 0.
    pids_limit: "${FALCON_SZ_NEWS_PIDS:-800}"
    volumes:
    - worker_news_outputs:/app/outputs
    - ./apps/scrapers/worker-news/outputs:/app/outputs-host
    # VNC desktop's Chrome profile — named volume so logins/cookies/saved
    # passwords survive container recreation instead of resetting on deploy.
    - ./apps/scrapers/worker-news/news_vnc_profile:/app/news_vnc_profile
    depends_on:
      redis:
        condition: service_started
      flaresolverr:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:3012/healthz
      # Liveness only — /healthz never touches Xvfb or CDP. Browser/desktop
      # readiness lives at GET /auth/readyz (verify-scrapers.sh probes it).
      # The generous timeout/retries are deliberate: this worker imports ~130
      # scraper modules plus feedparser/playwright at boot, and nothing in the
      # stack acts on `unhealthy` anyway (no autoheal; `restart: unless-stopped`
      # does not restart on healthcheck failure), so tightening these only
      # produces false red — it does not recover anything.
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # A leak should fail loudly here rather than quietly consuming the host.
          pids: "${FALCON_SZ_NEWS_PIDS:-800}"
          memory: "${FALCON_SZ_NEWS_MEM:-6G}"
          cpus: "${FALCON_SZ_NEWS_CPU:-4}"
        reservations:
          memory: "${FALCON_SZ_NEWS_MEM_RES:-512M}"
          cpus: "${FALCON_SZ_NEWS_CPU_RES:-1}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
