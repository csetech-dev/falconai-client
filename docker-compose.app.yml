      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:12004}
      MINIO_PUBLIC_USE_SSL: 'false'
      X_LANE_PLATFORM: TWITTER
      X_LANE_NOVNC_URL_TEMPLATE: ${X_LANE_NOVNC_URL_TEMPLATE:-/viewer/x/lane/{port}/vnc.html?autoconnect=1&resize=scale&path=viewer/x/lane/{port}/websockify}
    command:
    - sh
    - -lc
    - 'mkdir -p /app/x_chrome_profile /app/lanes && chown -R root:root /app/x_chrome_profile;
      Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99
      ]; do sleep 0.2; done; export DISPLAY=:99; openbox --config-file /app/openbox-rc.xml
      >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -listen
      0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/
      7900 localhost:5900 >/tmp/websockify.log 2>&1 & run-py app

      '
    shm_size: "${FALCON_SZ_X_SHM:-1gb}"
    volumes:
