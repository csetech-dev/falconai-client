      PORT: 3013
      DISPLAY: :99
      X_PROFILE_DIR: /app/x_chrome_profile
      X_VNC_URL: http://localhost:12085/viewer
      X_RAW_NOVNC_URL: http://localhost:12085/vnc/vnc.html?autoconnect=1&resize=scale&path=vnc/websockify
      REDIS_HOST: falcon-redis
