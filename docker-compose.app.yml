  worker-video:
    profiles: ["scrapers"]
    build:
      context: ./apps/scrapers/worker-video
      dockerfile: Dockerfile
    container_name: worker-video
    restart: unless-stopped
    ports:
    - 12101:3016
    environment:
      PORT: 3016
      HOST: 0.0.0.0
      DEBUG: 'false'
      WORKERS: 4
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
      REDIS_HOST: falcon-redis
      REDIS_PORT: 6379
      DOWNLOAD_DIR: /app/downloads
      MAX_VIDEO_DURATION_SECONDS: 3600
      MAX_FILE_SIZE_MB: 500
      # Max playlist pages (×50 videos) a campaign scrape walks back before the
      # date-window boundary. Raise for high-frequency channels (news) so older
      # in-range videos aren't truncated. Each page = 1 API unit.
      YT_CAMPAIGN_MAX_PAGES: ${YT_CAMPAIGN_MAX_PAGES:-15}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: imas
      MINIO_USE_SSL: 'false'
      VIDEO_QUEUE_NAME: video-jobs
      # Timezone — must match the server's local timezone so that user-supplied
      # HH:MM start/end times for live recording are interpreted correctly.
      TZ: Asia/Dhaka
      LOCAL_UTC_OFFSET_HOURS: '6'
      # Bounded so concurrent yt-dlp/ffmpeg downloads (which write to the RAM
      # tmpfs below) + the resident VNC Chrome (~1.7G) can't blow the memory cap
      # and trigger OOM SIGKILL of the download workers.
      # Fallback concurrency — used only when multi-account is OFF or lane
      # capacity can't be read. Under multi-account, concurrency is auto-derived
      # to the live lane capacity (Σ per-account maxConcurrent), so throughput
      # scales as accounts are added — no need to edit this.
      WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-2}
      # Hard OOM guard on the auto-derived value: never run more than this many
      # parallel downloads regardless of summed maxConcurrent.
      WORKER_CONCURRENCY_MAX: "${WORKER_CONCURRENCY_MAX:-16}"
      # When all lanes are busy (not "no lanes"), fail the job instead of
      # downloading on the un-pinned legacy session. Off = best-effort fallback.
      YT_STRICT_LANE: "${YT_STRICT_LANE:-false}"
      # Multi-account lanes require a SINGLE gunicorn worker as the lane owner (the
      # LaneManager semaphore + per-lane desktops live in one process); the
      # download consumer acquires lanes over loopback HTTP. Extra threads keep
      # health/status responsive while some threads block on lane acquire.
      GUNICORN_WORKERS: 1
      GUNICORN_THREADS: ${VIDEO_GUNICORN_THREADS:-8}
      YT_API_KEY: ${YT_API_KEY:-}
      PROXY_ROTATOR_URL: http://proxy-rotator:8888
      PROXY_ENABLED: 'true'
      # ── Multi-account "lane" routing (YouTube). Default ON. worker-video pulls
      # its YOUTUBE SocialAccount registry from core and runs one login Chrome +
      # noVNC per Gmail identity; downloads load-balance across lanes. Per-lane
      # noVNC is reached via the gateway at /viewer/youtube/lane/<7910+i>/*.
      YT_MULTI_ACCOUNT_ENABLED: "${YT_MULTI_ACCOUNT_ENABLED:-true}"
      WORKER_VIDEO_LANE_PLATFORM: YOUTUBE
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-85234569495721}
    shm_size: "${FALCON_SZ_VIDEO_SHM:-1gb}"
    volumes:
    - video_downloads:/app/downloads
    - ./apps/scrapers/worker-video/cookies.txt:/app/cookies.txt:rw
    # Persist the YouTube VNC login across redeploys — same host-bind pattern as
    # worker-fb's facebook_vnc_profile. Otherwise every recreate wipes the
    # operator's session and downloads start hitting YouTube's bot check.
    - ./apps/scrapers/worker-video/youtube_vnc_profile:/app/youtube_vnc_profile
    # Per-lane Chrome profiles (one dir per Gmail identity: /app/lanes/<i>/...)
    - ./apps/scrapers/worker-video/lanes:/app/lanes
    tmpfs:
    - /app/downloads/tmp:size=5g,mode=1777
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:3016/health')
    deploy:
      resources:
        limits:
          # Must fit: VNC Chrome (~1.7G) + the 5G download tmpfs (RAM-backed,
          # counts against this cgroup) + concurrent yt-dlp/ffmpeg. 2G caused
          # constant OOM SIGKILL of downloads.
          memory: "${FALCON_SZ_VIDEO_MEM:-2G}"
          cpus: "${FALCON_SZ_VIDEO_CPU:-1.5}"
        reservations:
          memory: "${FALCON_SZ_VIDEO_MEM_RES:-512M}"
          cpus: "${FALCON_SZ_VIDEO_CPU_RES:-0.25}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
