      X_MULTI_ACCOUNT_ENABLED: "true"
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-85234569495721}
      # MinIO — re-host downloaded tweet videos so the stored link survives X's
      # expiring CDN URLs (parity with worker-fb's /reel/video download mode).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: imas
