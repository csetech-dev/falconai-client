name: falcon-app
x-logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-healthcheck-defaults:
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s
services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: falcon-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'false'
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      DISABLE_SECURITY_PLUGIN: 'true'
      indices.query.bool.max_clause_count: 8192
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 12050:9200
    - 12051:9600
    volumes:
    - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health || exit 1
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_OS_MEM:-2G}"
          cpus: "${FALCON_SZ_OS_CPU:-2}"
        reservations:
          memory: "${FALCON_SZ_OS_MEM_RES:-512M}"
          cpus: "${FALCON_SZ_OS_CPU_RES:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  redis:
    image: redis:alpine
    container_name: falcon-redis
    restart: unless-stopped
    ports:
    - 12003:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_REDIS_MEM:-1G}"
          cpus: "${FALCON_SZ_REDIS_CPU:-1}"
        reservations:
          memory: "${FALCON_SZ_REDIS_MEM_RES:-512M}"
          cpus: "${FALCON_SZ_REDIS_CPU_RES:-0.25}"
    command: 'redis-server --maxmemory ${REDIS_MAXMEMORY:-640mb} --maxmemory-policy noeviction --appendonly
      yes --appendfsync everysec --tcp-backlog 511 --timeout 0 --tcp-keepalive 300

      '
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  # WireGuard tunnel endpoint for encrypted app<->storage traffic.
  # Terminates the tunnel at 10.9.0.2, and republishes the storage ports on this
  # host (bound to STORAGE_SERVER_IP) so both app containers AND the host-level
  # deploy-app preflight reach storage over the encrypted tunnel. It DNATs those
  # ports to 10.9.0.1 (the storage peer). App services keep using STORAGE_SERVER_IP
  # unchanged. See docs/WIREGUARD_STORAGE_TUNNEL.md. Config: ./infra/wireguard/app/wg0.conf
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: falcon-wg-app
    restart: unless-stopped
    # Only started when the deploy script activates the "wireguard" profile
    # (WIREGUARD_ENABLED=true, the default).
    profiles:
    - wireguard
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-UTC}
    volumes:
    - ./infra/wireguard/app:/config/wg_confs
    - /lib/modules:/lib/modules:ro
    ports:
    - ${WG_LISTEN_PORT:-51820}:51820/udp
    - ${STORAGE_SERVER_IP}:${POSTGRES_PORT:-12002}:12002
    - ${STORAGE_SERVER_IP}:${MINIO_API_PORT:-12004}:12004
    - ${STORAGE_SERVER_IP}:${MINIO_CONSOLE_PORT:-12015}:12015
    healthcheck:
      test:
      - CMD-SHELL
      - wg show wg0 >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  proxy-rotator:
    build:
      context: ./apps/proxy-rotator
      dockerfile: Dockerfile
    container_name: proxy-rotator
    restart: unless-stopped
    ports:
    - 12120:8888
    environment:
      PROXY_LIST_FILE: /app/proxies.txt
      HEALTH_CHECK_URL: https://httpbin.org/ip
      HEALTH_CHECK_INTERVAL: '300'
      PROXY_TIMEOUT: '30'
      MAX_FAILURES: '3'
      COOLDOWN_SECONDS: '600'
      ASSIGNMENT_TIMEOUT: '1800'
      MAX_SHARED: '4'
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8888/health')
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_PROXY_MEM:-256M}"
          cpus: "${FALCON_SZ_PROXY_CPU:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  adminer:
    image: adminer
    restart: always
    ports:
    - 12030:8080
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST}
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_ADMINER_MEM:-256M}"
          cpus: "${FALCON_SZ_ADMINER_CPU:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  falcon-core:
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    container_name: falcon-core
    restart: unless-stopped
    ports:
    - 12010:4000
    environment: &core-env
      # api | automation | all. The default is `api`: this container serves
      # the dashboard and nothing else, while falcon-core-automation below
      # runs every scheduler, queue consumer and AI loop. They are one
      # process's worth of work split across two, because Node is
      # single-threaded and a scrape batch was starving the UI.
      #
      # The two MUST move together. Setting this to `all` without also
      # stopping falcon-core-automation runs every automation TWICE against
      # the same rows; leaving it `api` with no automation container running
      # stops all background work silently. `GET /api/v1/health` reports the
      # role, and `/api/v1/health/runtime` reports `planeSeen` — false there
      # means this container is serving fine and nothing is automating.
      SERVICE_ROLE: ${CORE_SERVICE_ROLE:-api}
      PORT: 4000
      AUTH_SERVICE_URL: http://falcon-auth:3001/api/v1/auth
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-falcon-ai-jwt-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/falcon_ai?schema=public&connection_limit=${CORE_DB_CONNECTION_LIMIT:-15}&pool_timeout=${CORE_DB_POOL_TIMEOUT:-20}&application_name=${CORE_DB_APP_NAME:-falcon-core}
      REDIS_HOST: falcon-redis
      REDIS_PORT: 6379
      AUTH_SESSION_CACHE_TTL_S: ${AUTH_SESSION_CACHE_TTL_S:-30}
      AUTH_REQUIRE_SID: ${AUTH_REQUIRE_SID:-false}
      # Endpoint keeps its previous value as a default so existing deploys are
      # unaffected; it is not a secret, only an address.
      EXTERNAL_AI_API_URL: ${EXTERNAL_AI_API_URL:-http://203.190.12.139:8000}
      # NO DEFAULT — a credential must never be committed. The previous literal
      # was live in git history and must be treated as compromised: rotate it,
      # then set the new value in .env.app. Unset means no Authorization header
      # is sent, which fails loudly at the upstream rather than silently
      # authenticating with a leaked key.
      EXTERNAL_AI_API_KEY: ${EXTERNAL_AI_API_KEY:-}
      VIDEO_AI_API_URL: ${VIDEO_AI_API_URL:-}
      CORE_API_BASE_URL: ${PUBLIC_GATEWAY_URL}/api/core
      WEBHOOK_BASE_URL: ${PUBLIC_GATEWAY_URL}/api/core/ai-analysis
      # --- Outbound messaging: OAuth2 partner connections ---
      # PUBLIC_GATEWAY_URL is interpolated above but was never passed INTO the
      # container, so the partner-sign-in origin check had nothing to fall back
      # to and every Connect click 400'd. Export it explicitly.
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      # App origins allowed to complete a partner sign-in — guards against an
      # authorization code being redirected to a host we don't control. The
      # effective list is the UNION of this, PUBLIC_GATEWAY_URL and CORS_ORIGIN.
      #
      # Defaulted to the public hostnames operators actually browse, which are
      # also the ones registered on the partner side. PUBLIC_GATEWAY_URL alone
      # is not enough: on app1 it is the internal https://app1.csetech.diu.edu.bd,
      # while the partner only accepts stage-mms / mmas — so a sign-in started
      # from the public host would be rejected by our own check.
      MESSAGING_OAUTH_ALLOWED_ORIGINS: ${MESSAGING_OAUTH_ALLOWED_ORIGINS:-https://stage-mms.4sightdigi.com,https://mmas.hawkeyeinfo.xyz}
      # Encryption key for partner OAuth tokens at rest. Optional: when unset a
      # STABLE key is derived from JWT_SECRET (never a random per-boot key, which
      # would silently orphan every stored connection on restart). Set a
      # dedicated key (openssl rand -base64 32) to decouple it from JWT_SECRET.
      MESSAGING_TOKEN_ENC_KEY: ${MESSAGING_TOKEN_ENC_KEY:-}
      UV_THREADPOOL_SIZE: ${CORE_UV_THREADPOOL_SIZE:-16}
      NODE_OPTIONS: --max-old-space-size=${CORE_NODE_HEAP_MB:-2048}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: imas
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:12004}
      MINIO_PUBLIC_USE_SSL: 'false'
      MINIO_USE_GATEWAY_URL: 'true'
      WEB_WORKER_URL: http://web-worker:8000
      INTERNAL_AI_WORKER_URL: http://internal-ai:8000
      WORKER_LINKEDIN_URL: http://worker-linkedin:3011
      WORKER_IMAGE_URL: http://worker-image:3015
      WORKER_X_URL: http://worker-x:3013
      WORKER_NEWS_URL: http://worker-news:3012
      NEWS_CORE_AUTO_PARALLEL: ${NEWS_CORE_AUTO_PARALLEL:-6}
      NEWS_CORE_AUTO_PARALLEL_WHEN_STUDIO: ${NEWS_CORE_AUTO_PARALLEL_WHEN_STUDIO:-1}
      NEWS_MEDIA_SOURCE_PARALLEL: ${NEWS_MEDIA_SOURCE_PARALLEL:-1}
      NEWS_SOURCE_TIMEOUT_MS: ${NEWS_SOURCE_TIMEOUT_MS:-180000}
      NEWS_SOURCE_MAX_ATTEMPTS: ${NEWS_SOURCE_MAX_ATTEMPTS:-3}
      BOT_DETECTION_WORKER_URL: http://worker-bot-detection:3016
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-85234569495721}
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY}
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://falcon-gateway:4010/api/v1}
      DEPLOY_PROJECT_DIR: /opt/FalconAI
      YT_MIN_VIDEO_DURATION_MINUTES: 20
      YT_CAMPAIGN_VIDEO_FORMAT: mp4
      YT_CAMPAIGN_VIDEO_CHUNK: 'false'
      YT_CAMPAIGN_VIDEO_CHUNK_SECONDS: 30
      ENABLE_SOCIAL_VIRAL_PIPELINE: 'true'
      ENABLE_SOCIAL_AUTO_SCHEDULE: 'true'
      FIRST_SNAPSHOT_DELAY_MINUTES: 60
      SECOND_SNAPSHOT_DELAY_MINUTES: 120
      THIRD_SNAPSHOT_DELAY_MINUTES: 180
      AUTO_SCHEDULE_INTERVAL_MINUTES: 240
      MIN_ENGAGEMENT_RATE: 3
      MIN_REACTION_RPM: 20
      MIN_COMMENT_RPM: 0
      MIN_SHARE_RPM: 0
      BAD_POST_RETENTION_DAYS: 60
      MAX_SNAPSHOT_ATTEMPTS: 3
      SOCIAL_SCRAPER_CONCURRENCY: ${SOCIAL_SCRAPER_CONCURRENCY:-10}
    depends_on:
      redis:
        condition: service_started
      internal-ai:
        condition: service_started
      web-worker:
        condition: service_started
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/FalconAI:/opt/FalconAI
    - /home/fawz/.gitconfig:/root/.gitconfig:ro
    - /home/fawz/.git-credentials:/root/.git-credentials:ro
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4000/api/v1/health
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_CORE_MEM:-3G}"
          cpus: "${FALCON_SZ_CORE_CPU:-3}"
        reservations:
          memory: "${FALCON_SZ_CORE_MEM_RES:-256M}"
          cpus: "${FALCON_SZ_CORE_CPU_RES:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  # The automation plane. Runs every scheduler timer, BullMQ consumer and AI
  # loop, plus the machine-facing HTTP the workers call.
  #
  # It exists because core used to run ~20 scheduler timers, 9 queue consumers
  # (SocialProcessor alone at concurrency 24) and three AI automation loops on
  # the SAME event loop that served the dashboard — so a scrape batch made the
  # UI crawl. Node is single-threaded, so no amount of CPU quota fixed that;
  # only a second process could.
  #
  # Started unconditionally, and deliberately NOT behind a compose profile:
  # COMPOSE_PROFILES is a compose environment variable and cannot be defaulted
  # from inside this file, which made the split impossible to enable on a host
  # whose .env is not editable. To go back to one all-in-one container, set
  # CORE_SERVICE_ROLE=all AND stop this service — leaving both running executes
  # every automation twice against the same rows.
  #
  # Shares Postgres and Redis with the api plane and coordinates over a Redis
  # bus. No docker.sock: deployment is a panel action, served by the api plane.
  falcon-core-automation:
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    container_name: falcon-core-automation
    restart: unless-stopped
    ports:
    - 12011:4000
    environment:
      <<: *core-env
      SERVICE_ROLE: automation
      # Its own heap and connection pool: this plane holds the big scrape
      # payloads, the api plane mostly serializes query results.
      NODE_OPTIONS: --max-old-space-size=${CORE_AUTO_NODE_HEAP_MB:-2048}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/falcon_ai?schema=public&connection_limit=${CORE_AUTO_DB_CONNECTION_LIMIT:-10}&pool_timeout=${CORE_DB_POOL_TIMEOUT:-20}&application_name=${CORE_AUTO_DB_APP_NAME:-falcon-core-automation}
    depends_on:
      redis:
        condition: service_started
      internal-ai:
        condition: service_started
      web-worker:
        condition: service_started
    volumes:
    - /opt/FalconAI:/opt/FalconAI
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4000/api/v1/health
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_CORE_AUTO_MEM:-2G}"
          cpus: "${FALCON_SZ_CORE_AUTO_CPU:-2}"
        reservations:
          memory: "${FALCON_SZ_CORE_AUTO_MEM_RES:-256M}"
          cpus: "${FALCON_SZ_CORE_AUTO_CPU_RES:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  falcon-auth:
    build:
      context: ./apps/falcon-auth
      dockerfile: Dockerfile
    container_name: falcon-auth
    restart: unless-stopped
    ports:
    - 12012:3001
    environment:
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: falcon_ai
      DATABASE_POOL_MAX: ${AUTH_DB_POOL_MAX:-8}
      DATABASE_POOL_IDLE_MS: ${AUTH_DB_POOL_IDLE_MS:-30000}
      DATABASE_APPLICATION_NAME: ${AUTH_DB_APP_NAME:-falcon-auth}
      REDIS_HOST: ${REDIS_HOST:-falcon-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AUTH_SESSION_CACHE_TTL_S: ${AUTH_SESSION_CACHE_TTL_S:-30}
      AUTH_REQUIRE_SID: ${AUTH_REQUIRE_SID:-false}
      JWT_SECRET: ${JWT_SECRET:-falcon-ai-jwt-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-falcon-ai-refresh-secret}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGIN: ${AUTH_CORS_ORIGIN:-http://${APP_HOST:-localhost}:12001}
      OIDC_MANDATORY: ${OIDC_MANDATORY:-true}
      OIDC_LOGIN_MODE: ${OIDC_LOGIN_MODE:-server}
      AUTH_BLOCK_NON_BROWSER_CLIENTS: ${AUTH_BLOCK_NON_BROWSER_CLIENTS:-true}
      AUTH_BLOCKED_CLIENT_UAS: ${AUTH_BLOCKED_CLIENT_UAS:-}
      KEYCLOAK_AUTO_PROVISION: ${KEYCLOAK_AUTO_PROVISION:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/falcon}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-falcon-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-falcon-oidc-client-secret}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://${APP_HOST:-localhost}:12006/api/auth/oidc/callback}
      OIDC_FRONTEND_URL: ${OIDC_FRONTEND_URL:-http://${APP_HOST:-localhost}:12001}
      OIDC_SCOPES: ${OIDC_SCOPES:-"openid email profile"}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-http://${APP_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-12140}/realms/falcon/protocol/openid-connect/auth}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://keycloak:8080/realms/falcon/protocol/openid-connect/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/falcon/protocol/openid-connect/certs}
      OIDC_ALLOW_INSECURE_REQUESTS: ${OIDC_ALLOW_INSECURE_REQUESTS:-true}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-falcon}
      KEYCLOAK_HTTP_RELATIVE_PATH: ${KEYCLOAK_HTTP_RELATIVE_PATH:-/}
      PORT: 3001
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - node
      - -e
      - "require('http').get('http://localhost:3001/api/v1/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_AUTH_MEM:-512M}"
          cpus: "${FALCON_SZ_AUTH_CPU:-1}"
        reservations:
          memory: "${FALCON_SZ_AUTH_MEM_RES:-128M}"
          cpus: "${FALCON_SZ_AUTH_CPU_RES:-0.25}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: falcon-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
    - ${KEYCLOAK_HOST_PORT:-12140}:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-${KEYCLOAK_HOST:-localhost}}
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOSTNAME_PORT:-${KEYCLOAK_HOST_PORT:-12140}}
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_HTTP_RELATIVE_PATH:-/}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-xforwarded}
    volumes:
    - ./infra/keycloak/realm-falcon.json:/opt/keycloak/data/import/realm-falcon.json:ro
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
      test:
      - CMD-SHELL
      - exec 3<>/dev/tcp/127.0.0.1/8080
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_KEYCLOAK_MEM:-1G}"
          cpus: "${FALCON_SZ_KEYCLOAK_CPU:-1}"
        reservations:
          memory: "${FALCON_SZ_KEYCLOAK_MEM_RES:-256M}"
          cpus: "${FALCON_SZ_KEYCLOAK_CPU_RES:-0.25}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  falcon-ai-py:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: falcon-ai-service
    restart: unless-stopped
    ports:
    - 12020:5000
    environment:
      PORT: 5000
      ANALYZER_TYPE: mock
      CORS_ORIGINS: http://localhost:12001,http://localhost:12010
      UVICORN_WORKERS: ${AI_UVICORN_WORKERS:-2}
      OMP_NUM_THREADS: ${AI_OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${AI_MKL_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: 'true'
      PROXY_ROTATOR_URL: http://proxy-rotator:8888
      PROXY_ENABLED: 'true'
      # Same Gemini navigation timeout as internal-ai — both scrape the same
      # page and share the same throttled egress.
      GEMINI_NAVIGATION_TIMEOUT_MS: ${GEMINI_NAVIGATION_TIMEOUT_MS:-180000}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health
    deploy:
      resources:
        limits:
          memory: "${FALCON_SZ_AIPY_MEM:-4G}"
          cpus: "${FALCON_SZ_AIPY_CPU:-2}"
        reservations:
          memory: "${FALCON_SZ_AIPY_MEM_RES:-512M}"
          cpus: "${FALCON_SZ_AIPY_CPU_RES:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - falcon-net
  falcon-analytics:
    build:
      context: .
      dockerfile: ./apps/falcon-analytics/Dockerfile
    container_name: falcon-analytics
    restart: unless-stopped
    ports:
    - 12025:4005
    environment:
      PORT: 4005
      NODE_ENV: production
