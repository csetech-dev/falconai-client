# Pull pre-built FalconAI images from GHCR (no source build on client).
#
# Requires in .env.app (or shell):
#   GHCR_IMAGE_PREFIX=ghcr.io/<your-org>/falconai
#   FALCON_IMAGE_TAG=latest          # or a commit SHA for pinning
#
# Usage (application stack):
#   docker login ghcr.io -u <user> --password-stdin
#   docker compose --env-file .env.app \
#     -f docker-compose.app.yml -f docker-compose.ghcr.yml pull
#   docker compose --env-file .env.app \
#     -f docker-compose.app.yml -f docker-compose.ghcr.yml up -d --no-build
#
# Usage (monolithic stack — deploy-agent on client):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.ghcr.yml up -d --no-build

x-ghcr-image: &ghcr-image
  pull_policy: always

x-worker-news-image: &worker-news-image
  <<: *ghcr-image
  image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX in .env}/worker-news:${FALCON_IMAGE_TAG:-latest}

# GHCR images ship .pyc only — must not use `python api.py` / `python app.py`.
#
# worker-news: VNC desktop ONLY — no google-chrome here. Chrome is launched by
# routes/vnc_desktop.py `_launch_chrome()` as an argv list, because every value
# in this string is shell-parsed (an unquoted `--proxy-bypass-list=...,<-loopback>`
# was read as a redirection and stopped Chrome from ever starting) and because
# this shell's argv would otherwise contain "google-chrome", making any
# `pkill -f google-chrome` kill the supervisor and the container with it.
# Must stay byte-identical to apps/scrapers/worker-news/Dockerfile's CMD and to
# the `command:` in docker-compose.yml / docker-compose.app.yml — enforced by
# apps/scrapers/worker-news/tests/test_dockerfile_cmd.py.
x-worker-news-command: &worker-news-command
  command:
    - sh
    - -lc
    # $$ escapes Compose's own interpolation so a literal $ reaches the
    # container's shell (see the matching note in docker-compose.app.yml).
    - 'rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; mkdir -p $${NEWS_VNC_PROFILE_DIR:-/app/news_vnc_profile}; Xvfb :99 -screen 0 1280x800x16 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; if command -v xset >/dev/null 2>&1; then xset s off -dpms s noblank; fi; openbox >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -noxdamage -xkb -repeat -defer 10 -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & exec gunicorn -c gunicorn_conf.py --bind 0.0.0.0:$${PORT} --workers $${WORKERS} --threads $${THREADS} --timeout $${GUNICORN_TIMEOUT} --graceful-timeout $${GUNICORN_GRACEFUL_TIMEOUT} --max-requests $${GUNICORN_MAX_REQUESTS} --max-requests-jitter $${GUNICORN_MAX_REQUESTS_JITTER} app:app'

x-worker-fb-command: &worker-fb-command
  command:
    - sh
    - -lc
    - 'mkdir -p /app/facebook_vnc_profile; Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; if command -v xset >/dev/null 2>&1; then xset s off -dpms s noblank; fi; openbox >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -noxdamage -xkb -repeat -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & if command -v xset >/dev/null 2>&1; then (while true; do DISPLAY=:99 xset s off -dpms s noblank >/dev/null 2>&1; sleep 30; done) & fi; run-py api'

x-worker-x-command: &worker-x-command
  command:
    - sh
    - -lc
    - 'mkdir -p /app/x_chrome_profile /app/lanes && chown -R root:root /app/x_chrome_profile; Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; openbox --config-file /app/openbox-rc.xml >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & run-py app'

x-worker-linkedin-command: &worker-linkedin-command
  command:
    - sh
    - -lc
    - 'mkdir -p /app/linkedin_chrome_profile /app/lanes; Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; if command -v xset >/dev/null 2>&1; then xset s off -dpms s noblank; fi; openbox >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -noxdamage -xkb -repeat -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & if command -v xset >/dev/null 2>&1; then (while true; do DISPLAY=:99 xset s off -dpms s noblank >/dev/null 2>&1; sleep 30; done) & fi; run-py api'

x-web-worker-command: &web-worker-command
  command:
    - sh
    - -lc
    - 'mkdir -p /app/.chrome-profile /app/lanes && chown -R root:root /app/.chrome-profile; Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; export DISPLAY=:99; openbox --config-file /app/openbox-rc.xml >/tmp/openbox.log 2>&1 & x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 >/tmp/x11vnc.log 2>&1 & websockify --web=/usr/share/novnc/ 7900 localhost:5900 >/tmp/websockify.log 2>&1 & run-py api'

services:
  # Third-party public image (NOT Falcon GHCR_IMAGE_PREFIX).
  # keep pin so `make deploy-ghcr` / pull never remaps flaresolverr to org registry.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    pull_policy: always

  proxy-rotator:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/proxy-rotator:${FALCON_IMAGE_TAG:-latest}

  falcon-core:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/core-service:${FALCON_IMAGE_TAG:-latest}
    environment:
      # Container-internal deploy dir. The technical-panel service writes
      # .deploy/trigger under this path, so it MUST equal the container-side mount
      # target below — that way the file lands on the host (via the bind mount)
      # where the deploy-agent watches it. Kept as /opt/falconai-client so the
      # container path matches the host client-bundle dir (no /opt/FalconAI).
      DEPLOY_PROJECT_DIR: /opt/falconai-client
      # --- Outbound messaging: OAuth2 partner connections ---
      # Declared here as well as in the base file: `environment` maps MERGE
      # across compose files (unlike the `!override` volumes above), so this is
      # belt-and-braces — it guarantees the vars reach the GHCR container even
      # if this service is ever composed without the base file.
      #
      # Both are optional — the feature self-configures on first start:
      #   * key unset  -> derived deterministically from JWT_SECRET (stable
      #     across restarts/replicas; set a dedicated key to decouple the two)
      #   * origins unset -> falls back to PUBLIC_GATEWAY_URL, then CORS_ORIGIN
      # The connection tables are likewise created by core-service on boot, so
      # there is no manual DDL step.
      MESSAGING_TOKEN_ENC_KEY: ${MESSAGING_TOKEN_ENC_KEY:-}
      MESSAGING_OAUTH_ALLOWED_ORIGINS: ${MESSAGING_OAUTH_ALLOWED_ORIGINS:-}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FALCON_DEPLOY_DIR:-.}:/opt/falconai-client

  # Same image as falcon-core — the two planes differ only by SERVICE_ROLE,
  # which the base compose file sets. Part of the default topology; see the
  # base file for what it runs and how to revert to one all-in-one container.
  falcon-core-automation:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/core-service:${FALCON_IMAGE_TAG:-latest}
    environment:
      # Same client-bundle deploy dir as falcon-core. This plane never writes
      # a deploy trigger (that is a panel action, served by the api plane) and
      # deliberately gets no docker.sock.
      DEPLOY_PROJECT_DIR: /opt/falconai-client
    volumes: !override
      - ${FALCON_DEPLOY_DIR:-.}:/opt/falconai-client

  falcon-auth:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/falcon-auth:${FALCON_IMAGE_TAG:-latest}
    environment:
      REDIS_HOST: ${REDIS_HOST:-falcon-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

  falcon-ai-py:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/ai-service:${FALCON_IMAGE_TAG:-latest}

  falcon-analytics:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/falcon-analytics:${FALCON_IMAGE_TAG:-latest}

  search-service:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/search-service:${FALCON_IMAGE_TAG:-latest}

  falcon-gateway:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/falcon-gateway:${FALCON_IMAGE_TAG:-latest}

  api-gateway:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/api-gateway:${FALCON_IMAGE_TAG:-latest}

  worker-bot-detection:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/worker-bot-detection:${FALCON_IMAGE_TAG:-latest}

  worker-fb:
    <<: [*ghcr-image, *worker-fb-command]
    image: ${GHCR_IMAGE_PREFIX}/worker-fb:${FALCON_IMAGE_TAG:-latest}
    environment:
      FB_MULTI_ACCOUNT_ENABLED: "true"
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}

  worker-linkedin:
    <<: [*ghcr-image, *worker-linkedin-command]
    image: ${GHCR_IMAGE_PREFIX}/worker-linkedin:${FALCON_IMAGE_TAG:-latest}
    environment:
      LINKEDIN_MULTI_ACCOUNT_ENABLED: "true"
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      LINKEDIN_LANE_PLATFORM: LINKEDIN

  worker-x:
    <<: [*ghcr-image, *worker-x-command]
    image: ${GHCR_IMAGE_PREFIX}/worker-x:${FALCON_IMAGE_TAG:-latest}
    environment:
      X_MULTI_ACCOUNT_ENABLED: "true"
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      X_LANE_PLATFORM: TWITTER

  web-worker:
    <<: [*ghcr-image, *web-worker-command]
    image: ${GHCR_IMAGE_PREFIX}/web-worker:${FALCON_IMAGE_TAG:-latest}
    environment:
      WEB_WORKER_MULTI_ACCOUNT_ENABLED: "true"
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      WEB_WORKER_LANE_PLATFORM: WEB_WORKER

  worker-news:
    <<: [*worker-news-image, *worker-news-command]
    environment:
      CORE_SERVICE_URL: ${CORE_INTERNAL_URL:-http://falcon-core-automation:4000}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-85234569495721}
      NEWS_BROWSER_TOTAL_SLOTS: ${NEWS_BROWSER_TOTAL_SLOTS:-6}
      NEWS_BROWSER_STUDIO_RESERVED: ${NEWS_BROWSER_STUDIO_RESERVED:-2}
      NEWS_BROWSER_AUTO_SLOTS: ${NEWS_BROWSER_AUTO_SLOTS:-3}
      NEWS_BROWSER_AUTO_WHEN_STUDIO: ${NEWS_BROWSER_AUTO_WHEN_STUDIO:-0}
      NEWS_BROWSER_INTERACTIVE_SLOTS: ${NEWS_BROWSER_INTERACTIVE_SLOTS:-2}
      NEWS_BROWSER_INTERACTIVE_WHEN_STUDIO: ${NEWS_BROWSER_INTERACTIVE_WHEN_STUDIO:-0}
      NEWS_BROWSER_LANE_ACQUIRE_TIMEOUT: ${NEWS_BROWSER_LANE_ACQUIRE_TIMEOUT:-45}
      NEWS_BROWSER_MAX_LIVE: ${NEWS_BROWSER_MAX_LIVE:-6}
      NEWS_BROWSER_PROCS_PER_SLOT: ${NEWS_BROWSER_PROCS_PER_SLOT:-12}
      NEWS_BROWSER_RELEASE_ON_CONTEXT_CLOSE: ${NEWS_BROWSER_RELEASE_ON_CONTEXT_CLOSE:-1}
      NEWS_BROWSER_ORPHAN_KILL: ${NEWS_BROWSER_ORPHAN_KILL:-1}
      NEWS_BROWSER_MAX_AGE_SECONDS: ${NEWS_BROWSER_MAX_AGE_SECONDS:-180}
      NEWS_BROWSER_MAX_USES: ${NEWS_BROWSER_MAX_USES:-15}
      NEWS_BROWSER_REAPER_INTERVAL_SECONDS: ${NEWS_BROWSER_REAPER_INTERVAL_SECONDS:-15}
      NEWS_BROWSER_RSS_PRESSURE_RATIO: ${NEWS_BROWSER_RSS_PRESSURE_RATIO:-0.82}
      NEWS_BROWSER_LAUNCH_WAIT_SECONDS: ${NEWS_BROWSER_LAUNCH_WAIT_SECONDS:-20}
      NEWS_CLEAR_LANES_ON_START: ${NEWS_CLEAR_LANES_ON_START:-1}

      NEWS_ARTICLE_TIMEOUT_SECONDS: ${NEWS_ARTICLE_TIMEOUT_SECONDS:-30}
      # Kept identical to docker-compose.app.yml: this overlay is layered AFTER it,
      # so a divergent default here silently wins over the base file.
      NEWS_SOURCE_TIMEOUT_SECONDS: ${NEWS_SOURCE_TIMEOUT_SECONDS:-180}
      NEWS_TOP_NEWS_SOURCE_TIMEOUT_SECONDS: ${NEWS_TOP_NEWS_SOURCE_TIMEOUT_SECONDS:-180}
      NEWS_TODAYS_SOURCE_TIMEOUT_SECONDS: ${NEWS_TODAYS_SOURCE_TIMEOUT_SECONDS:-180}

  # REMOVED 2026-08-03 — worker-news-{media-1,scheduler,todays-scheduler,
  # trending-scheduler,top-scheduler,map,tv}.
  #
  # These were defined here and NOWHERE else: no matching service in
  # docker-compose.app.yml or docker-compose.yml. Compose merges service maps,
  # so an overlay-only service is still created — which is why production grew
  # containers like falcon-app-worker-news-top-scheduler-1. With no base service
  # to merge with they inherited no command/env/volumes and simply ran the
  # worker-news image default CMD (gunicorn app:app), i.e. idle duplicates of
  # the worker-news API. Nothing ever routed to their hostnames.
  #
  # News scheduling lives in core-service (NewsScheduleService /
  # NewsTopNewsScheduleService), which dispatches to WORKER_NEWS_URL ->
  # http://worker-news:3012. Commit c906a50d (2026-06-27) dropped the last
  # depends_on references; these stubs were the leftovers.
  #
  # Deploy with `--remove-orphans` to tear the running containers down.

  worker-telegram:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/worker-telegram:${FALCON_IMAGE_TAG:-latest}

  worker-video:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/worker-video:${FALCON_IMAGE_TAG:-latest}

  worker-image:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/worker-image:${FALCON_IMAGE_TAG:-latest}

  internal-ai:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/internal-ai:${FALCON_IMAGE_TAG:-latest}

  falcon-frontend:
    <<: *ghcr-image
    image: ${GHCR_IMAGE_PREFIX}/web:${FALCON_IMAGE_TAG:-latest}

  scraper-viewer-proxy:
    volumes: !override
      - ./infra/nginx/scraper-viewer-proxy.conf:/etc/nginx/nginx.conf:ro
